name: Ghost Drain APK check

on:
  pull_request:
    branches: ['ghost-drain/integration']

permissions:
  contents: read

jobs:
  assemble:
    if: github.head_ref == 'ghost-drain/build-check'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-drain-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
