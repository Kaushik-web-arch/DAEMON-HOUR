name: Ghost Drain APK check

on:
  pull_request:
    branches: ['ghost-drain/integration']

permissions:
  contents: read

jobs:
  assemble:
    if: github.head_ref == 'ghost-drain/build-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ce1874c68e63c45f32b43b2e5539ab1993600839
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -d "$ANDROID_HOME/build-tools/34.0.0" ]]; then
            sdkmanager_path=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)
            "$sdkmanager_path" 'platforms;android-35' 'build-tools;34.0.0'
          fi
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-drain-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
